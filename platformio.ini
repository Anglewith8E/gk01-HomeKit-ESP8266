; GK01 红外遥控器 → Apple HomeKit 原生配件固件
; 硬件: 小兀 GK01 (ESP12F / ESP8266, 4MB Flash)
[env:gk01]
platform = espressif8266@3.2.0        ; 对应 ESP8266 Arduino core 2.7.4 (HomeKit 库的推荐核心版本)
board = esp12e                        ; ESP12F 等价于 esp12e 板型 (4MB Flash)
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.f_cpu = 160000000         ; HomeKit 库强制要求 160MHz, 否则配对时 iOS 会超时
board_build.flash_mode = dio
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK221
; HomeKit 库 (lib/Arduino-HomeKit-ESP8266) 与 WiFiManager v2.0.16-rc.2 (lib/WiFiManager)
; 已随工程捆绑在 lib/ 目录, 无需从网络安装 (2.0.17 需要 core 3.x, 与 2.7.4 不兼容)
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
